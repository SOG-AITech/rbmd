name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ============ CUDA 10.2 - 老旧 GPU 兼容版 (Kepler ~ Turing) ============
  cuda-10:
    runs-on: ubuntu-18.04
    container:
      image: nvidia/cuda:10.2-devel-ubuntu18.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake build-essential git pkg-config wget bzip2 libopenmpi-dev openmpi-bin

      - name: Install NCCL
        run: |
          apt-get install -y libnccl2=2.8.3-1+cuda10.2 libnccl-dev=2.8.3-1+cuda10.2 || \
          apt-get install -y libnccl2 libnccl-dev || true
        
      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTATIC_BUILD=ON \
            -DUSE_CUDA=ON \
            -DUSE_MPI=ON \
            -DWARP_SIZE_64=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="30;35;37;50;52;53;60;61;62;70;72;75"
          cmake --build build -j$(nproc)
      
      - name: Package
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p dist/bin dist/examples
          cp build/rbmd-gpu dist/bin/
          cp -r examples/* dist/examples/
          cp README.md LICENSE dist/ 2>/dev/null || true
          cat > dist/RUNTIME_REQUIREMENTS.md <<'EOF'
          This package requires a compatible system OpenMPI runtime.
          CI release binaries do not bundle MPI libraries and must be run with an OpenMPI runtime matching the release build environment.
          CUDA builds also require the target system to provide compatible NVIDIA driver and NCCL runtime libraries.
          EOF
          tar -czvf rbmd-gpu-${VERSION}-cuda10.2-ubuntu18.04-x64.tar.gz -C dist .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbmd-gpu-cuda10.2
          path: rbmd-gpu-*.tar.gz

  # ============ CUDA 11.8 - 广泛兼容版 (GTX 10 ~ RTX 40 全系列) ============
